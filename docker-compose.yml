x-service-templates:
  go-backend: &go-backend
    build:
      context: .
      dockerfile: Dockerfile
    networks:
      - payment-processor
    depends_on:
      - redis

services:
  go-backend-1:
    <<: *go-backend
    container_name: go-backend-1
    ports:
      - "9091:80"
    environment:
    - PAYMENT_PROCESSOR_URL_DEFAULT=http://payment-processor-default:8080
    - PAYMENT_PROCESSOR_URL_FALLBACK=http://payment-processor-fallback:8080
    - PORT=80
    - REDIS_ADDR=redis-db:6379
    - MONITOR_HEALTH=true
    - ENABLE_PROFILING=false
    - WORKERS=20
    - RETRY_QUEUE_SIZE=6000
    - OTEL_SERVICE_NAME=go-service-1
    - OTEL_EXPORTER_OTLP_ENDPOINT=http://jaeger:4317
    - OTEL_PROPAGATORS=tracecontext,baggage
    depends_on:
      - jaeger
    networks:
      - app
      - payment-processor
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: "100MB"

  go-backend-2:
    <<: *go-backend
    container_name: go-backend-2
    ports:
      - "9092:80"
    environment:
    - PAYMENT_PROCESSOR_URL_DEFAULT=http://payment-processor-default:8080
    - PAYMENT_PROCESSOR_URL_FALLBACK=http://payment-processor-fallback:8080
    - PORT=80
    - REDIS_ADDR=redis-db:6379
    - MONITOR_HEALTH=false
    - ENABLE_PROFILING=false
    - WORKERS=20
    - RETRY_QUEUE_SIZE=6000
    - OTEL_SERVICE_NAME=go-service-2
    - OTEL_EXPORTER_OTLP_ENDPOINT=http://jaeger:4317
    - OTEL_PROPAGATORS=tracecontext,baggage
    depends_on:
      - jaeger
    networks:
      - app
      - payment-processor
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: "100MB"

  redis:
    image: redis:8.0-alpine
    container_name: redis-db
    command: redis-server --save "" --appendonly no --maxclients 20000
    networks:
      - app
      - payment-processor
    ports:
      - "6379:6379"
    deploy:
      resources:
        limits:
          cpus: "0.3"
          memory: "100MB"

  load-balancer:
    container_name: load-balancer-nginx
    image: nginx:1.29.0-otel
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./opentelemetry_module.conf:/etc/nginx/conf.d/opentelemetry_module.conf
    depends_on:
      - go-backend-1
      - go-backend-2
    ports:
      - "9999:9999"
    networks:
      - app
    deploy:
      resources:
        limits:
          cpus: "0.2"
          memory: "50MB"

  jaeger:
    image: jaegertracing/all-in-one:1.71.0
    environment:
      - COLLECTOR_OTLP_ENABLED=true
      - JAEGER_PROPAGATION=w3c
    ports:
      - "16686:16686"  # Jaeger UI
      - "4317:4317"    # OTLP/gRPC
    networks:
      - app
      - payment-processor

networks:
  app:
    driver: bridge
  payment-processor:
    external: true